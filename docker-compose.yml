services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - "NODES_EXCLUDE=[]"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: