name: Run automation tests

# khai báo event nào sẽ kích hoạt workflow này
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

#khai báo các job sẽ chạy selenium
jobs:
  test:
    name: Tạo môi trường server
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # 1 browser fail sẽ ko hùy job của browser khác để thấy kết quả các browser
      matrix:
        browser: [ chrome, firefox ]

    steps:
      #      tải source code của repo về máy ảo để có code mới nhất
      - name: Checkout source code
        uses: actions/checkout@v4
      #      cai dat JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        run: mvn test -Dbrowser=${{matrix.browser}}
      - name: Tổng hợp kết quả test
        if: always()
        run: |
          # lấy tất cả scenario trong target/cucumber.json (Cucumber tự sinh sau khi chạy test)
          SCENARIOS='[.[].elements[] | select(.type == "scenario")]'
          # tổng số scenario
          TOTAL=$(jq "$SCENARIOS | length" target/cucumber.json)
          # scenario fail = có ít nhất 1 step không ở trạng thái passed
          FAILED=$(jq "$SCENARIOS | map(select(any(.steps[]; .result.status != \"passed\"))) | length" target/cucumber.json)
          # số scenario pass = tổng - fail
          PASSED=$((TOTAL - FAILED))
          # file excel mới nhất vừa được tạo trong lần chạy này (ls -t: mới nhất đứng đầu)
          EXCEL_FILE=$(ls -t src/test/resources/data/TestResults*.xlsx | head -n 1)
          # ghi vào GITHUB_ENV để các bước sau dùng được ($TOTAL, $PASSED, ...)
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "EXCEL_FILE=$EXCEL_FILE" >> $GITHUB_ENV
      - name: Gửi báo cáo + file excel lên Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          method: files.uploadV2 # API upload file của Slack
          token: ${{ secrets.SLACK_BOT_TOKEN }} # token của Slack bot (xoxb-...)
          payload: |
            channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
            initial_comment: "Kết quả test trên ${{ matrix.browser }}: tổng ${{ env.TOTAL }} | pass ${{ env.PASSED }} | fail ${{ env.FAILED }}"
            file: ${{ env.EXCEL_FILE }}
            filename: TestResults-${{ matrix.browser }}.xlsx