# c?u hình ch?y song song cho Cucumber (Junit platform engine)

# B?t tính n?ng ch?y song song
cucumber.execution.parallel.enabled=true

# strategy=fixed => s? thread c? ??nh = s? feature file hi?n có
# không nên setup s? thread quá l?n so v?i CPU/RAM
# dùng khi bi?t rõ s? l??ng feature c?n vi?t
#cucumber.execution.parallel.config.strategy=fixed
#cucumber.execution.parallel.config.fixed.parallelism=3

cucumber.execution.parallel.config.strategy=dynamic
cucumber.execution.parallel.config.dynamic.factor=1

# execution-mode.feature=same_thread => các test case (scenario) trong cùng
# feature s? ch?y tu?n t?
cucumber.execution.execution-mode.feature=same_thread

